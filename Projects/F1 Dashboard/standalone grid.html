<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standalone Dynamic Bento Grid</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React-Grid-Layout Core and Resizable Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/react-grid-layout@1.4.4/css/styles.css" integrity="sha384-oL3FAWHQC/MNGYySRjub/NDXeh7qLs86iOWOPEyunDUUqxMuW3vti5/a32lSha9n" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/react-resizable@3.0.5/css/styles.css" integrity="sha384-06y1M5slGjLqahZD1k8tdsVnnXVVH50QJFNy2tCGiwtSehLT78XxuHz0RXtnJKkE" crossorigin="anonymous">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1c1d24 0%, #0c0d10 100%);
      font-family: 'Inter', sans-serif;
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      pointer-events: none;
      z-index: 3;
      opacity: 2%;
    }

    .react-grid-item.react-grid-placeholder {
      background: rgba(219, 8, 1, 0.15) !important;
      border: 2px dashed rgba(219, 8, 1, 0.4) !important;
      z-index: 2;
      user-select: none;
      border-radius: 24px;
      transition: all 400ms ease 0s !important;
      will-change: transform;
    }

    .react-grid-item {
      transition: 400ms ease 0s;
    }
  </style>

  <meta name="description" content="Detailed view of Standalone grid">
  <link rel="icon" type="image/svg+xml" href="../../asterisk%20logo%20new.svg"></head>
<body><h1 style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;">Standalone Dynamic Bento Grid</h1>

  <!-- On-Screen Error Diagnostics -->
  <div id="error-console" style="display: none; padding: 20px; background: #fee2e2; color: #991b1b; border: 2px solid #f87171; margin: 20px; font-family: monospace; border-radius: 8px; z-index: 9999; position: relative;">
    <h3 style="margin-top: 0; font-weight: bold;">JavaScript Error Detected:</h3>
    <pre id="error-log" style="white-space: pre-wrap; word-break: break-all;"></pre>
  </div>

  <script>
    window.process = { env: { NODE_ENV: 'production' } };
    window.addEventListener('error', function(e) {
      document.getElementById('error-console').style.display = 'block';
      document.getElementById('error-log').textContent += '\n' + e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' + (e.error ? e.error.stack : '');
    });

    if (window.self !== window.top) {
      document.addEventListener('DOMContentLoaded', function() {
        document.body.style.background = 'transparent';
        document.body.style.overflow = 'hidden';
        const rootNode = document.getElementById('root');
        if (rootNode) {
          rootNode.className = "relative z-10 flex items-center justify-center w-full h-full";
          rootNode.style.minHeight = '100vh';
          rootNode.style.padding = '0';
          rootNode.style.margin = '0';
        }
        const overlayNode = document.querySelector('.overlay');
        if (overlayNode) overlayNode.style.display = 'none';

        // Inject light mode style overrides for iframe
        const style = document.createElement('style');
        style.textContent = `
          .text-white { color: #09090b !important; }
          .border-white\\/5 { border-color: rgba(9, 9, 11, 0.08) !important; }
          .bg-white\\/\\[0\\.02\\] { background-color: rgba(9, 9, 11, 0.02) !important; }
          .react-grid-item > div {
             background-color: rgba(225, 6, 0, 0.06) !important;
             color: #e10600 !important;
             border: 1px solid rgba(225, 6, 0, 0.15) !important;
             box-shadow: 0 4px 12px rgba(225, 6, 0, 0.05) !important;
          }
          .react-grid-item > div:hover {
             border-color: rgba(225, 6, 0, 0.35) !important;
          }
          .react-grid-item > div span {
             color: #e10600 !important;
          }
          .opacity-60 { opacity: 0.75 !important; }
        `;
        document.head.appendChild(style);
      });
    }
  </script>

  <div class="overlay"></div>
  <div id="root" class="relative z-10 min-h-screen py-10 flex items-center justify-center"></div>

  <!-- CDN Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin=""></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin=""></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous" integrity="sha384-/AfDwVDXNopzPvhxMPQ11y1OCpR6mVkWx47qzSwIiquvxkcMkZddEzDNtIOtfCpk"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js" integrity="sha384-H6KKS1H1WwuERMSm+54dYLzjg0fKqRK5ZRyASdbrI/lwrCc6bXEmtGYr5SwvP1pZ" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-grid-layout@1.4.4/dist/react-grid-layout.min.js" integrity="sha384-yHCa+jW1cDHQj+rOuthkp9eJY7k28sZDL3D935PBuNrHS4vnSt/04yl32vqFLX8U" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState } = React;
    const { Responsive, WidthProvider } = ReactGridLayout;
    const ResponsiveReactGridLayout = WidthProvider(Responsive);

    const Block = React.memo(({ label }) => {
      return (
        <div className="w-full h-full rounded-3.5xl flex flex-col items-center justify-center relative group p-4 border transition-all duration-300">
          <span className="font-bold text-xl select-none flex items-center gap-1">
            {label.split(" ")[0]} <span className="font-bold">{label.split(" ")[1]}</span>
          </span>
          <div className="absolute bottom-2 right-2 w-2 h-2 rounded-full opacity-60" />
        </div>
      );
    });

    const keys = ["a", "b", "c", "d", "e", "f", "g"];

    const AboutLayout = {
      lg: [
        { i: "a", x: 0, y: 0, w: 2, h: 2 },
        { i: "b", x: 2, y: 0, w: 1, h: 1 },
        { i: "c", x: 3, y: 0, w: 1, h: 1 },
        { i: "d", x: 2, y: 1, w: 1, h: 1 },
        { i: "e", x: 3, y: 1, w: 1, h: 1 },
        { i: "f", x: 0, y: 2, w: 2, h: 1 },
        { i: "g", x: 2, y: 2, w: 2, h: 1 },
      ],
      xs: [
        { i: "a", x: 0, y: 0, w: 1, h: 1, static: true },
        { i: "b", x: 0, y: 1, w: 1, h: 1, static: true },
        { i: "c", x: 0, y: 2, w: 1, h: 1, static: true },
        { i: "d", x: 0, y: 3, w: 1, h: 1, static: true },
        { i: "e", x: 0, y: 4, w: 1, h: 1, static: true },
        { i: "f", x: 0, y: 5, w: 1, h: 1, static: true },
        { i: "g", x: 0, y: 6, w: 1, h: 1, static: true },
      ]
    };

    function tryExpandLeft(layout, grid, x, y, cols) {
      if (x <= 0) return false;
      const leftItemId = grid[y][x - 1];
      if (!leftItemId) return false;
      const leftItem = layout.find(item => item.i === leftItemId);
      if (!leftItem) return false;
      
      const newW = leftItem.w + 1;
      if (newW * leftItem.h > 6) return false;

      let canExpand = true;
      for (let dy = 0; dy < leftItem.h; dy++) {
        if (grid[leftItem.y + dy][leftItem.x + newW - 1] !== null) {
          canExpand = false;
          break;
        }
      }

      if (canExpand) {
        for (let dy = 0; dy < leftItem.h; dy++) {
          grid[leftItem.y + dy][leftItem.x + newW - 1] = leftItem.i;
        }
        leftItem.w = newW;
        return true;
      }
      return false;
    }

    function tryExpandRight(layout, grid, x, y, cols) {
      if (x >= cols - 1) return false;
      const rightItemId = grid[y][x + 1];
      if (!rightItemId) return false;
      const rightItem = layout.find(item => item.i === rightItemId);
      if (!rightItem) return false;
      
      const newW = rightItem.w + 1;
      const newX = rightItem.x - 1;
      if (newX < 0 || newW * rightItem.h > 6) return false;

      let canExpand = true;
      for (let dy = 0; dy < rightItem.h; dy++) {
        if (grid[rightItem.y + dy][newX] !== null) {
          canExpand = false;
          break;
        }
      }

      if (canExpand) {
        for (let dy = 0; dy < rightItem.h; dy++) {
          grid[rightItem.y + dy][newX] = rightItem.i;
        }
        rightItem.w = newW;
        rightItem.x = newX;
        return true;
      }
      return false;
    }

    function tryExpandTop(layout, grid, x, y) {
      if (y <= 0) return false;
      const topItemId = grid[y - 1][x];
      if (!topItemId) return false;
      const topItem = layout.find(item => item.i === topItemId);
      if (!topItem) return false;
      
      const newH = topItem.h + 1;
      if (topItem.w * newH > 6) return false;

      let canExpand = true;
      for (let dx = 0; dx < topItem.w; dx++) {
        if (grid[topItem.y + newH - 1][topItem.x + dx] !== null) {
          canExpand = false;
          break;
        }
      }

      if (canExpand) {
        for (let dx = 0; dx < topItem.w; dx++) {
          grid[topItem.y + newH - 1][topItem.x + dx] = topItem.i;
        }
        topItem.h = newH;
        return true;
      }
      return false;
    }

    function tryExpandBottom(layout, grid, x, y) {
      const rows = grid.length;
      if (y >= rows - 1) return false;
      const bottomItemId = grid[y + 1][x];
      if (!bottomItemId) return false;
      const bottomItem = layout.find(item => item.i === bottomItemId);
      if (!bottomItem) return false;
      
      const newH = bottomItem.h + 1;
      const newY = bottomItem.y - 1;
      if (newY < 0 || bottomItem.w * newH > 6) return false;

      let canExpand = true;
      for (let dx = 0; dx < bottomItem.w; dx++) {
        if (grid[newY][bottomItem.x + dx] !== null) {
          canExpand = false;
          break;
        }
      }

      if (canExpand) {
        for (let dx = 0; dx < bottomItem.w; dx++) {
          grid[newY][bottomItem.x + dx] = bottomItem.i;
        }
        bottomItem.h = newH;
        bottomItem.y = newY;
        return true;
      }
      return false;
    }

    function packAndFillLayout(layout, cols, rows, changedItem, breakpoint) {
      const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
      const newLayoutMap = new Map();

      if (changedItem) {
        const item = { ...changedItem, w: Math.max(1, Math.min(changedItem.w, cols)), h: Math.max(1, Math.min(changedItem.h, rows)) };
        item.x = Math.max(0, Math.min(item.x, cols - item.w));
        item.y = Math.max(0, Math.min(item.y, rows - item.h));
        
        for (let dy = 0; dy < item.h; dy++) {
          for (let dx = 0; dx < item.w; dx++) {
            grid[item.y + dy][item.x + dx] = item.i;
          }
        }
        newLayoutMap.set(item.i, item);
      }

      const remainingItems = layout
        .filter(item => !changedItem || item.i !== changedItem.i)
        .map(item => ({ id: item.i, origW: item.w, origH: item.h }));

      function solveLayoutPlacement(items, grid, itemIndex, cols, rows, placements) {
        if (itemIndex >= items.length) return true;

        const item = items[itemIndex];
        const candidates = [
          { w: item.origW, h: item.origH },
          { w: 1, h: 1 },
          { w: 2, h: 1 },
          { w: 1, h: 2 },
          { w: 2, h: 2 },
          { w: 3, h: 1 },
          { w: 3, h: 2 }
        ].filter(cand => cand.w <= cols && cand.h <= rows && cand.w * cand.h <= 6);

        const uniqueCandidates = [];
        const seen = new Set();
        for (const cand of candidates) {
          const key = `${cand.w}x${cand.h}`;
          if (!seen.has(key)) {
            seen.add(key);
            uniqueCandidates.push(cand);
          }
        }

        for (const cand of uniqueCandidates) {
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              if (x + cand.w <= cols && y + cand.h <= rows) {
                let canFit = true;
                for (let dy = 0; dy < cand.h; dy++) {
                  for (let dx = 0; dx < cand.w; dx++) {
                    if (grid[y + dy][x + dx] !== null) {
                      canFit = false;
                      break;
                    }
                  }
                  if (!canFit) break;
                }

                if (canFit) {
                  for (let dy = 0; dy < cand.h; dy++) {
                    for (let dx = 0; dx < cand.w; dx++) {
                      grid[y + dy][x + dx] = item.id;
                    }
                  }
                  placements.set(item.id, { x, y, w: cand.w, h: cand.h });

                  if (solveLayoutPlacement(items, grid, itemIndex + 1, cols, rows, placements)) {
                    return true;
                  }

                  for (let dy = 0; dy < cand.h; dy++) {
                    for (let dx = 0; dx < cand.w; dx++) {
                      grid[y + dy][x + dx] = null;
                    }
                  }
                  placements.delete(item.id);
                }
              }
            }
          }
        }

        return false;
      }

      const placements = new Map();
      solveLayoutPlacement(remainingItems, grid, 0, cols, rows, placements);

      for (const [id, pos] of placements.entries()) {
        const origItem = layout.find(it => it.i === id);
        newLayoutMap.set(id, {
          ...origItem,
          x: pos.x,
          y: pos.y,
          w: pos.w,
          h: pos.h
        });
      }

      const newLayout = Array.from(newLayoutMap.values());

      let changed = true;
      while (changed) {
        changed = false;
        let foundEmpty = false;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (grid[y][x] === null) {
              foundEmpty = true;
              if (tryExpandLeft(newLayout, grid, x, y, cols) ||
                  tryExpandRight(newLayout, grid, x, y, cols) ||
                  tryExpandTop(newLayout, grid, x, y) ||
                  tryExpandBottom(newLayout, grid, x, y)) {
                changed = true;
                break;
              }
            }
          }
          if (changed) break;
        }
        if (!foundEmpty) break;
      }

      return newLayout;
    }

    function Layout() {
      const [layouts, setLayouts] = useState(() => ({
        lg: packAndFillLayout(AboutLayout.lg, 4, 3, null, "lg"),
        xs: packAndFillLayout(AboutLayout.xs, 1, 3, null, "xs")
      }));
      const [currentCols, setCurrentCols] = useState(4);
      const [currentBreakpoint, setCurrentBreakpoint] = useState("lg");
      const [scale, setScale] = useState(1);
      const wrapperRef = React.useRef(null);

      const onBreakpointChange = (newBreakpoint, newCols) => {
        setCurrentBreakpoint(newBreakpoint);
        setCurrentCols(newCols);
      };

      React.useEffect(() => {
        const updateScale = () => {
          const parentWidth = window.innerWidth;
          const parentHeight = window.innerHeight;
          
          const targetW = 504;
          const targetH = 477;
          
          const scaleX = parentWidth / targetW;
          const scaleY = parentHeight / targetH;
          
          const newScale = Math.max(0.2, Math.min(scaleX, scaleY));
          setScale(newScale);
        };

        updateScale();
        window.addEventListener("resize", updateScale);
        return () => window.removeEventListener("resize", updateScale);
      }, []);

      const handleDrag = (currentLayout, _oldItem, newItem) => {
        const filledCurrentLayout = packAndFillLayout(currentLayout, currentCols, 3, newItem, currentBreakpoint);
        setLayouts(prev => ({ ...prev, [currentBreakpoint]: filledCurrentLayout }));
      };

      const handleResize = (currentLayout, _oldItem, newItem) => {
        const filledCurrentLayout = packAndFillLayout(currentLayout, currentCols, 3, newItem, currentBreakpoint);
        setLayouts(prev => ({ ...prev, [currentBreakpoint]: filledCurrentLayout }));
      };

      return (
        <div style={{ width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', margin: 0, padding: 0 }}>
          <div 
            ref={wrapperRef}
            className="mx-auto flex items-center justify-center"
            style={{
              width: "504px",
              height: "477px",
              minWidth: "504px",
              minHeight: "477px",
              maxWidth: "504px",
              maxHeight: "477px",
              padding: "0px",
              boxSizing: "border-box",
              transform: `scale(${scale})`,
              transformOrigin: "center center",
              transition: "transform 0.1s ease-out",
              flexShrink: 0
            }}
          >
            <ResponsiveReactGridLayout
              className="m-auto" 
              style={{
                width: "504px",
                height: "454px"
              }}
              breakpoints={{ lg: 0 }}  
              cols={{ lg: 4 }}  
              rowHeight={144.66}
              layouts={layouts}
              compactType={null}
              maxRows={3}
              onDrag={handleDrag}
              onResize={handleResize}
              onDragStop={handleDrag}
              onResizeStop={handleResize}
              onBreakpointChange={onBreakpointChange}
              margin={[10, 10]}
              containerPadding={[0, 0]}
            >
              {keys.map((key) => (
                <div
                  key={key}
                  className="flex justify-center items-center shadow-[inset_0_0_0_2px_rgba(0,0,0,0)] rounded-3.5xl text-2xl text-white visible cursor-grab active:cursor-grabbing"
                >
                  <Block label={"Tile " + key.toUpperCase()} />
                </div>
              ))}
            </ResponsiveReactGridLayout>
          </div>
        </div>
      );
    }

    const Block = ({ label }) => {
      const [word, keyPart] = label.split(" ");
      return (
        <div
          style={{ 
            backgroundColor: 'rgba(219, 8, 1, 0.22)',
            backdropFilter: 'blur(12px) saturate(180%)',
            WebkitBackdropFilter: 'blur(12px) saturate(180%)',
            border: '1px solid rgba(255, 255, 255, 0.12)'
          }}
          className="h-full w-full flex flex-col justify-center items-center p-6 text-white rounded-3xl shadow-[0_8px_32px_0_rgba(219,8,1,0.15)] hover:border-white/20 transition-all duration-300"
        >
          <span>
            <span className="normal-case opacity-60 font-medium">{word}</span>{" "}
            <span className="font-bold tracking-wider">{keyPart}</span>
          </span>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Layout />);
  </script>


</body></html>
